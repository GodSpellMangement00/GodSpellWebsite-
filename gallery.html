<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GodSpell | Bases & Builds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Use your main CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Safety styles so it NEVER breaks */
    body {
      background: radial-gradient(circle at top, #2b155f, #0b061a);
      color: #eee;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    h1 {
      margin-bottom: 6px;
      color: #caa8ff;
      text-shadow: 0 0 15px rgba(180,120,255,.6);
    }

    p {
      opacity: .8;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      max-width: 1100px;
      margin: auto;
    }

    .grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(150,100,255,.35);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(170,120,255,.7);
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg,#8a5cff,#b18cff);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(170,120,255,.6);
    }
  </style>
</head>

<body>

  <h1>Our Bases & Builds</h1>
  <p>Survival creations by GodSpell members</p>

  <div class="grid">
    <img src="gallery/base1.jpg" alt="Base 1">
    <img src="gallery/base2.jpg" alt="Base 2">
    <img src="gallery/base3.jpg" alt="Base 3">
    <img src="gallery/base4.jpg" alt="Base 4">
    <img src="gallery/base5.jpg" alt="Base 5">
    <img src="gallery/base6.jpg" alt="Base 6">
    <img src="gallery/base7.jpg" alt="Base 7">
    <img src="gallery/base8.jpg" alt="Base 8">
    <img src="gallery/base9.jpg" alt="Base 9">
    <img src="gallery/base10.jpg" alt="Base 10">
    <img src="gallery/base11.jpg" alt="Base 11">
    <img src="gallery/base12.jpg" alt="Base 12">
  </div>

  <a class="back" href="index.html">← Back to Home</a>

</body>
</html>
